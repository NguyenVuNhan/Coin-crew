name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    # The name stays as it was so required status checks keep matching; it now also lints and builds.
    name: Typecheck and tests
    runs-on: ubuntu-latest
    env:
      # The Zalo build needs an API origin; nothing built here is deployed.
      VITE_API_ORIGIN: https://example.invalid
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Sets NX_BASE/NX_HEAD: the PR's merge base, or the last successful run on main.
      - uses: nrwl/nx-set-shas@v4
      # Lint runs through Nx so the import rule sees the project graph.
      - run: npx nx affected -t lint typecheck build
      - run: npx nx affected -t test --parallel=1

  e2e:
    name: End-to-end golden path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # playwright.config.ts uses the installed Chrome (channel 'chrome'); GitHub's Ubuntu runners ship it.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
